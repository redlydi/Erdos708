
name: Unpack all Lean theorems

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Lean modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("Erdos708-All-Theorems.zip")

          if not archive.is_file():
              raise SystemExit("ZIP not found in repository root")

          modules = [
              "BoundedCores",
              "CoprimeCores",
              "FourPrimes",
              "G2",
              "G3",
              "HallReserve",
              "Repetitions",
              "SupportWidths",
          ]

          allowed = {
              *(f"Erdos708Formal/{m}.lean" for m in modules),
              "README-ALL-THEOREMS.md",
              "formal/ALL-THEOREMS-STATUS.md",
          }

          skipped = ".github/workflows/lean-all.yml"

          with ZipFile(archive) as z:
              names = {
                  n for n in z.namelist()
                  if not n.endswith("/")
              }

              if names != allowed | {skipped}:
                  raise SystemExit(
                      f"Unexpected ZIP contents: "
                      f"{names ^ (allowed | {skipped})}"
                  )

              for name in sorted(allowed):
                  target = Path(name)

                  if target.exists():
                      raise SystemExit(
                          f"Refusing to overwrite: {name}"
                      )

                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )
                  target.write_bytes(z.read(name))
                  print("Extracted:", name)

          archive.unlink()
          print("Extraction completed")
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Add eight Lean research modules"
          git push origin HEAD:main
