name: Verify all Erdos 708 Lean modules

on:
  push:
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean-all.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Initialize dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update

      - name: Download Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Compile project
        shell: bash
        run: |
          set -euo pipefail
          lake build

      - name: Compile all Lean modules
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            echo "================================"
            echo "Checking: $file"
            echo "================================"

            lake env lean "$file"

            count=$((count + 1))
          done < <(
            find Erdos708Formal \
              -type f \
              -name '*.lean' \
              -print0 | sort -z
          )

          echo "Verified $count Lean modules"

      - name: Reject unfinished proofs
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("Erdos708Formal.lean"),
              *Path("Erdos708Formal").rglob("*.lean"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8"
              )

              text = re.sub(
                  r"/-.*?-/",
                  "",
                  text,
                  flags=re.S
              )

              text = re.sub(
                  r"--[^\n]*",
                  "",
                  text
              )

              if re.search(
                  r"\b(sorry|admit)\b",
                  text
              ):
                  raise SystemExit(
                      f"Unfinished proof: {path}"
                  )

          print(
              "No sorry or admit detected"
          )
          PY

      - name: Verification summary
        if: success()
        shell: bash
        run: |
          echo "Lean project compiled"
          echo "All discovered modules checked"
          echo "No unfinished proofs detected"
