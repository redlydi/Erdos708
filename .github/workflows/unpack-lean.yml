name: Unpack Lean project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Lean project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("Erdos708-Lean-Starter.zip")

          if not archive.is_file():
              raise SystemExit(
                  "ZIP not found in repository root"
              )

          allowed = {
              ".gitignore",
              "Erdos708Formal/Support.lean",
              "Erdos708Formal.lean",
              "README-LEAN.md",
              "formal/STATUS.md",
              "lakefile.lean",
              "lean-toolchain",
              "legacy/Erdos708.lean",
          }

          skipped = ".github/workflows/lean.yml"

          with ZipFile(archive) as z:
              names = {
                  name for name in z.namelist()
                  if not name.endswith("/")
              }

              if names != allowed | {skipped}:
                  raise SystemExit(
                      f"Unexpected ZIP contents: "
                      f"{names ^ (allowed | {skipped})}"
                  )

              for name in sorted(allowed):
                  target = Path(name)
                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )
                  target.write_bytes(z.read(name))
                  print("Extracted:", name)

          archive.unlink()
          print("Lean project extracted successfully")
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Install Lean 4 project"
          git push origin HEAD:main
