name: Lean 4 formal checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Generate Lake manifest
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Compile Lean proofs
        run: lake build

      - name: Reject unfinished proofs
        run: |
          if grep -RnE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)' \
            Erdos708Formal.lean Erdos708Formal/; then
            echo "Unfinished proofs found"
            exit 1
          fi
