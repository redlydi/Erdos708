
name: Lean 4 formal checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Lean and verify proofs
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false

      - name: Reject unfinished proofs
        run: |
          if grep -RnE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)' \
            Erdos708Formal.lean Erdos708Formal/; then
            echo "Unfinished Lean proofs found"
            exit 1
          fi
