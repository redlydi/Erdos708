
name: Lean 4 verification FIXED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean installation
        run: |
          lean --version
          lake --version

      - name: Generate Lake manifest
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Compile Lean project
        run: lake build

      - name: Check unfinished proofs
        shell: bash
        run: |
          if grep -RnE \
            '(^|[[:space:]])(sorry|admit)([[:space:]]|$)' \
            Erdos708Formal.lean Erdos708Formal/; then
            echo "Unfinished proofs detected"
            exit 1
          fi
