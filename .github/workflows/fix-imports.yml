name: Fix Lean imports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix imports in all Lean modules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          folder = Path("Erdos708Formal")

          for path in sorted(folder.glob("*.lean")):
              lines = path.read_text().splitlines()

              imports = []
              body = []

              for line in lines:
                  stripped = line.strip()

                  if stripped in ("import Mathlib", "Import Mathlib"):
                      if "import Mathlib" not in imports:
                          imports.append("import Mathlib")
                  else:
                      body.append(line)

              if imports:
                  result = "\n".join(imports)
                  result += "\n\n"
                  result += "\n".join(body).lstrip("\n")
                  result = result.rstrip() + "\n"

                  path.write_text(result)
                  print("Fixed:", path)
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Erdos708Formal/

          if git diff --cached --quiet; then
            echo "Nothing to fix"
            exit 0
          fi

          git commit -m "Fix Lean import declarations"
          git push origin HEAD:main
