
name: Organize research repository

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Structure files and write documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          moves = {
              "REPORT.md": "reports/structural-research.md",
              "check.py": "code/check.py",
              "archive_g3.py": "code/archive_g3.py",
              "archive_repetitions.py": "code/archive_repetitions.py",
              "check_output.txt": "verification/check_output.txt",
              "archive_g3_output.txt": "verification/archive_g3_output.txt",
              "archive_repetitions_output.txt": "verification/archive_repetitions_output.txt",
          }

          for src, dst in moves.items():
              source, target = Path(src), Path(dst)
              if source.exists() and not target.exists():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(source), str(target))

          readme = """# Erdős–Surányi Problem 708

          Исследовательский репозиторий по проблеме Эрдёша №708.

          ## Постановка

          Пусть A — множество из n различных целых чисел
          от 2 до M, где M = max(A). Рассматриваем интервал
          I из M последовательных целых чисел.

          Обозначим τ(A,I) минимальное число различных
          элементов I, произведение которых делится на
          произведение всех элементов A.

          Исследуем величину g(n), получаемую максимизацией
          τ(A,I) по допустимым A и I.

          Главная цель: доказать g(n) ≤ (2 + o(1))n.

          ## Текущий статус

          Общая асимптотическая оценка остаётся открытой.

          В reports/structural-research.md представлены
          письменные доказательства новых утверждений:

          - Оценка τ(A,I) ≤ 2n + C(k) для семейств с
            ограниченным числом общих внутренних делителей.
          - Совместное покрытие при попарно взаимно
            простых внутренних делителях и ацикличности.
          - Оценка через ширину семейства носителей
            простых степеней.
          - Редукция для модулей из четырёх простых.

          Это авторские исследовательские результаты.
          Независимая рецензия и Lean-верификация
          новых теорем пока отсутствуют.

          ## Структура

          - `reports/` — математические отчёты.
          - `code/` — воспроизводимые Python-эксперименты.
          - `verification/` — сохранённые протоколы.
          - `.github/workflows/` — автоматические проверки.

          ## Воспроизведение

          Требуется Python 3.10+.
          Внешние пакеты не нужны.

          ```bash
          python3 code/check.py
          python3 code/archive_g3.py
          python3 code/archive_repetitions.py
          ```

          Проверки подтверждают вычислительные утверждения
          в пределах реализованных тестов, но не заменяют
          общих математических доказательств.

          ## Дальнейшее исследование

          Главная структурная задача — выбор внутренних
          пар для модулей из четырёх различных простых
          с суммарной ценой нарушений Холла o(n).

          ## Ссылки

          - https://www.erdosproblems.com/708
          """
          Path("README.md").write_text(
              "\n".join(line[10:] if line.startswith("          ") else line
                        for line in readme.splitlines()) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Verify Python syntax
        run: python3 -m compileall -q code

      - name: Create proposed changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="automation/organize-research"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Organize research files and README"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Organize Erdős 708 research" \
            --body "Structure research files and document their verification status." \
            || echo "Check the existing pull request."
  
